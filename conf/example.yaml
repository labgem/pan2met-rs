reference:
  padmet: /mnt/shared/bank/metacyc.padmet
  ncbi_taxonomy: /mnt/shared/bank/NCBI-Taxonomy/taxdmp_2026-01-01


pathway_score:
  threshold: 0.1
  components:
    - GenomicContextBoost
    - UniquenessScore
    - PresenceScore
    - KeyReactionScore

genomic_context:
  transitive_closure_gaps: 3


rules:
  - TransportPathway
  - SignalingPathway
  - AllReactionsCatalyzed
  - AllReactionsMissing
  - KeyReaction
  - SynthesisMissingLast
  - DegradationMissingFirst
  - EnergyMissingHalf
  - PathwayScore


